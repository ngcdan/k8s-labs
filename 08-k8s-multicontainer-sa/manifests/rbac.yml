# Role: chỉ cho phép đọc (get/list/watch) resource "services" trong namespace default
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: service-reader-role
  namespace: default
rules:
- apiGroups: [""]                          # "" = core API group (pods, services, configmaps...)
  resources: ["services"]                  # chỉ services
  verbs: ["get", "list", "watch"]          # chỉ đọc, KHÔNG create/delete
---
# RoleBinding: gán Role trên cho ServiceAccount "service-reader"
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: service-reader-binding
  namespace: default
subjects:                                  # gán cho AI
- kind: ServiceAccount
  name: service-reader
  namespace: default
roleRef:                                   # gán Role NÀO
  kind: Role
  name: service-reader-role
  apiGroup: rbac.authorization.k8s.io
