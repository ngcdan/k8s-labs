apiVersion: v1
kind: Pod
metadata:
  name: init-demo
spec:
  initContainers:
  # chờ DNS resolve được mới cho app container khởi động
  # dùng FQDN đầy đủ (busybox/musl không tự thêm search domain .default.)
  - name: wait-for-svc
    image: busybox
    command: ['sh', '-c', 'until nslookup my-svc.default.svc.cluster.local; do echo "waiting for my-svc..."; sleep 2; done']
  containers:
  - name: app
    image: nginx:alpine
